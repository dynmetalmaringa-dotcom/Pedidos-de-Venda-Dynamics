<script>
/* =====================================================================
   FLUXO VENDA DYNAMICS · Script V2.0
   ===================================================================== */
var TK = '', EU = null, B = null, TELA = '';
var F = { mes: '', dia: '', q: '', todo: false };          // filtros da Diretoria
var FC = { mes: '', q: '' };                               // filtros de Clientes
var SEL = {};                                              // cartões selecionados
var AUD = { cod: '', mes: '', q: '' };                     // auditoria
var LOGF = 'tudo';
var MESES = ['janeiro','fevereiro','março','abril','maio','junho','julho','agosto','setembro','outubro','novembro','dezembro'];
var SEMANA = ['domingo','segunda-feira','terça-feira','quarta-feira','quinta-feira','sexta-feira','sábado'];
var ROT = { dir: 'Diretoria', orc: 'Orçamento', adm: 'Suporte' };
var T_DIR = [['dia','Dia'],['mes','Mês'],['cli','Clientes']];
var T_ORC = [['aud','Auditoria'],['up','Upload e registros']];

/* ============================ utilidades ============================ */
function rs(n){ var a = Math.abs(Number(n) || 0); return a > 0 && a < 100 ? a.toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2}) : Math.round(a).toLocaleString('pt-BR'); }
function rs2(n){ return (Math.abs(Number(n) || 0)).toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2}); }
function pc(n){ return (Number(n) || 0).toLocaleString('pt-BR',{minimumFractionDigits:1,maximumFractionDigits:1}); }
function qt(n){ n = Number(n) || 0; return n % 1 ? n.toLocaleString('pt-BR',{maximumFractionDigits:3}) : String(n); }
function esc(s){ return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
function sn(v){ return v > 0.004 ? '+' : v < -0.004 ? '&minus;' : ''; }
function dObj(s){ var m = /^(\d{2})\/(\d{2})\/(\d{2,4})$/.exec(String(s || '').trim()); if (!m) return null; var a = +m[3]; if (a < 100) a += 2000; return new Date(a, +m[2] - 1, +m[1]); }
function chave(s){ var d = dObj(s); return d ? d.getFullYear() * 10000 + (d.getMonth() + 1) * 100 + d.getDate() : 0; }
function mesDe(s){ var d = dObj(s); return d ? d.getFullYear() + '-' + ('0' + (d.getMonth() + 1)).slice(-2) : ''; }
function mesNome(m){ var p = String(m).split('-'); return p.length === 2 ? MESES[+p[1] - 1] + ' ' + p[0] : 'todos os meses'; }
function extA(s){ var d = dObj(s); return d ? d.getDate() + ' de ' + MESES[d.getMonth()] + ' de ' + d.getFullYear() : esc(s); }
function semana(s){ var d = dObj(s); return d ? SEMANA[d.getDay()] : ''; }
function isoDe(s){ var d = dObj(s); return d ? d.getFullYear() + '-' + ('0' + (d.getMonth() + 1)).slice(-2) + '-' + ('0' + d.getDate()).slice(-2) : ''; }
function deIso(v){ var p = String(v).split('-'); return p.length === 3 ? p[2] + '/' + p[1] + '/' + p[0].slice(-2) : ''; }
function hojeBr(){ var h = new Date(); return ('0' + h.getDate()).slice(-2) + '/' + ('0' + (h.getMonth() + 1)).slice(-2) + '/' + String(h.getFullYear()).slice(-2); }
function diasAte(s){ var d = dObj(s); if (!d) return null; var h = new Date(); h.setHours(0,0,0,0); return Math.round((d - h) / 86400000); }
function prazo(s){
  var n = diasAte(s); if (n === null) return { t: '', c: '' };
  if (n === 0) return { t: 'vence hoje', c: 'pr' };
  if (n > 0) return { t: 'em ' + n + ' dia' + (n > 1 ? 's' : ''), c: '' };
  return { t: 'há ' + (-n) + ' dia' + (n < -1 ? 's' : ''), c: 'pr' };
}
function diasRev(s){ var n = diasAte(s); return n === null ? null : Math.max(0, -n); }
function clDias(n){ return n === null ? 'd3' : n > 180 ? 'd3' : n > 90 ? 'd2' : 'd1'; }
function txDias(n){ return n === null ? 'sem data' : n + ' dia' + (n === 1 ? '' : 's'); }
function norm(s){ return String(s || '').toUpperCase().normalize('NFD').replace(/[̀-ͯ]/g, ''); }
function osDe(oc){ return String(oc || '').replace(/-\d{2}$/, ''); }
var CORES = ['#0B63B5','#B0101A','#1C7A48','#A55A1C','#5B45A0','#0F7A8C','#7A1420','#3E4855','#8A6D00','#0B3C7D'];
function corDe(c){ var n = 0, s = String(c || '0'); for (var i = 0; i < s.length; i++) n += s.charCodeAt(i) * (i + 1); return CORES[n % CORES.length]; }
function iniDe(nome){ var p = String(nome || '').trim().split(/[\s._-]+/).filter(String); if (!p.length) return '··'; return p.length === 1 ? p[0].substring(0,2).toUpperCase() : (p[0].charAt(0) + p[1].charAt(0)).toUpperCase(); }
function marca(cd, nome){
  var lg = B && B.logos ? B.logos[cd] : null;
  if (lg) return '<div class="lg"><img src="' + lg + '" alt="' + esc(nome) + '"></div>';
  return '<div class="lg mn" style="background:' + corDe(cd || nome) + '">' + iniDe(nome) + '</div>';
}
function toast(m){ var t = document.getElementById('toast'); t.textContent = m; t.classList.add('on'); clearTimeout(window._tt); window._tt = setTimeout(function(){ t.classList.remove('on'); }, 3600); }
function dif(p){ return p.comp - p.tab; }
function clsDif(v, base){ if (!base) return 'nd'; return v > 0.005 ? 'ac' : v < -0.005 ? 'ab' : 'eq'; }
function bdgDesvio(p){
  if (p.sv) return '<span class="bdg nd">remessa sem valor</span>';
  if (!p.ct) return '<span class="bdg nd">sem tabela</span>';
  var v = dif(p), c = clsDif(v, p.tab);
  if (c === 'eq') return '<span class="bdg eq">igual à tabela</span>';
  return '<span class="bdg ' + c + '">' + sn(v) + 'R$ ' + rs(v) + ' · ' + sn(v) + pc(Math.abs(v / p.tab * 100)) + '%</span>';
}

/* ============================ servidor ============================ */
function srv(fn, args, ok, er){
  var r = google.script.run.withSuccessHandler(ok || function(){}).withFailureHandler(function(e){
    var m = e && e.message ? e.message : String(e);
    if (/SESSAO_EXPIRADA/.test(m)){ toast('Sessão expirada. Entre de novo.'); limparSessao(); mostrarLogin(); return; }
    if (er) er(m); else toast('Erro: ' + m);
  });
  r[fn].apply(r, args || []);
}
function reg(acao, det){ srv('registrar', [TK, acao, det]); }
function guardar(k, v){ try { if (v) sessionStorage.setItem(k, v); else sessionStorage.removeItem(k); } catch(e){} }
function lerG(k){ try { return sessionStorage.getItem(k) || ''; } catch(e){ return ''; } }
function limparSessao(){ TK = ''; guardar('fvd_tk', ''); guardar('fvd_eu', ''); }

/* ============================ login e termo ============================ */
var TERMO = '<p>Este termo regula o acesso ao aplicativo <b>Fluxo Venda Dynamics</b>, de propriedade da <b>Dynamics Metalurgica Ltda</b>, CNPJ 07.243.050/0001-49, com sede na Avenida Pioneiro Antonio Ruiz Saldanha, 2358, Jardim Industrial, Maringá-PR, CEP 87.065-290 (“Empresa”), controladora dos dados aqui tratados. Responsável: <b>Michele Puma</b>.</p>' +
  '<h4>1. Objeto</h4><p>O aplicativo reúne pedidos de venda, ordens de serviço, valores, tabelas de preço e informações comerciais de clientes da Empresa e do Grupo Pailon. Todo o conteúdo é <b>informação confidencial</b> e de uso exclusivamente interno.</p>' +
  '<h4>2. Compromisso de confidencialidade</h4><p>O usuário se compromete a: (a) usar as informações somente para as atividades da sua função; (b) não copiar, fotografar, imprimir, exportar ou repassar dados a terceiros, concorrentes, clientes ou fornecedores sem autorização da Diretoria; (c) não compartilhar usuário e senha, que são pessoais e intransferíveis; (d) encerrar a sessão ao deixar o equipamento; (e) comunicar imediatamente à Diretoria qualquer acesso indevido, perda ou vazamento.</p>' +
  '<h4>3. Proteção de dados pessoais (LGPD)</h4><p>O tratamento observa a Lei nº 13.709/2018. Os dados de clientes, revendas e contatos são tratados para execução de contratos e procedimentos comerciais (art. 7º, V) e legítimo interesse da Empresa na gestão de vendas e preços (art. 7º, IX), limitados ao mínimo necessário (art. 6º, III). Os dados do próprio usuário (nome, usuário, data e hora de acesso, ações realizadas) são tratados para segurança da informação e controle de acesso.</p>' +
  '<h4>4. Registro de atividades</h4><p>O usuário declara ciência de que <b>todos os acessos, consultas, impressões, downloads e envios de arquivos são registrados</b> com identificação, data e hora, e podem ser auditados pela Empresa.</p>' +
  '<h4>5. Direitos do titular</h4><p>Os titulares podem exercer os direitos do art. 18 da LGPD (confirmação, acesso, correção, anonimização, eliminação e informação sobre compartilhamento) pelo contato com a responsável indicada acima.</p>' +
  '<h4>6. Vigência e penalidades</h4><p>As obrigações de sigilo valem durante o vínculo com a Empresa e por 5 (cinco) anos após o seu término. O descumprimento sujeita o usuário às medidas disciplinares cabíveis, à responsabilização civil por perdas e danos e às sanções legais aplicáveis, inclusive às previstas na LGPD e no art. 195 da Lei nº 9.279/1996.</p>' +
  '<h4>7. Aceite</h4><p>Ao marcar “Li e aceito” e entrar, o usuário declara ter lido e concordado com este termo. O aceite é registrado com data e hora.</p>' +
  '<p style="margin-top:12px;color:#8C96A4">Maringá-PR · Dynamics Metalurgica Ltda · Termo versão 1.0</p>';
document.getElementById('termoTxt').innerHTML = TERMO;
function verTermo(e){ if (e) e.preventDefault(); document.getElementById('mdl').classList.add('on'); }
function fecharTermo(){ document.getElementById('mdl').classList.remove('on'); }
function aceitarTermo(){ document.getElementById('lgT').checked = true; fecharTermo(); }

function mostrarLogin(){
  document.getElementById('app').style.display = 'none';
  document.getElementById('lgn').style.display = '';
  document.getElementById('lgB').disabled = false;
}
function entrar(e){
  e.preventDefault();
  var u = document.getElementById('lgU').value.trim().toUpperCase(), s = document.getElementById('lgS').value;
  var ac = document.getElementById('lgT').checked, er = document.getElementById('lgE'), bt = document.getElementById('lgB');
  if (!u || !s){ er.textContent = 'Informe usuário e senha.'; return; }
  bt.disabled = true; bt.textContent = 'Entrando…'; er.textContent = '';
  srv('login', [u, s, ac], function(r){
    bt.disabled = false; bt.textContent = 'Entrar';
    if (!r.ok){ er.textContent = r.msg; if (r.termo) verTermo(); return; }
    TK = r.token; EU = { u: r.usuario, p: r.perfil, n: r.nome };
    guardar('fvd_tk', TK); guardar('fvd_eu', JSON.stringify(EU));
    document.getElementById('lgS').value = '';
    abrirApp();
  }, function(m){ bt.disabled = false; bt.textContent = 'Entrar'; er.textContent = 'Falha: ' + m; });
}
function sairApp(){ srv('sair', [TK]); limparSessao(); B = null; mostrarLogin(); }

function abrirApp(){
  document.getElementById('lgn').style.display = 'none';
  document.getElementById('app').style.display = '';
  document.getElementById('euNome').innerHTML = '<b>' + esc(EU.n) + '</b>' + (norm(EU.n) === norm(ROT[EU.p]) ? '' : ' · ' + (ROT[EU.p] || ''));
  document.getElementById('euIni').textContent = iniDe(EU.n);
  document.getElementById('wrap').innerHTML = '<div class="carregando"><div class="sp1"></div>Carregando a base…</div>';
  srv('carregar', [TK], iniciar, function(m){
    document.getElementById('wrap').innerHTML = '<div class="vazio"><b>Não consegui carregar a base</b><p>' + esc(m) + '</p></div>';
  });
}

(function(){
  var tk = lerG('fvd_tk'), eu = lerG('fvd_eu');
  if (tk && eu){ try { TK = tk; EU = JSON.parse(eu); abrirApp(); return; } catch(e){} }
  mostrarLogin();
})();

/* ============================ arranque ============================ */
var MESES_D = [];
function iniciar(d){
  B = d; EU = d.eu;
  B.P.forEach(function(p){ p.me = mesDe(p.dp); p.k = chave(p.dp); p.os = osDe(p.oc); p.bus = norm([p.oc, p.os.replace(/\D/g, ''), p.erp, p.cli, p.rv, p.loc].join(' ')); });
  B.P.sort(function(a, b){ return b.k - a.k || b.v - a.v; });
  var m = {}; B.P.forEach(function(p){ if (p.me) m[p.me] = 1; });
  MESES_D = Object.keys(m).sort().reverse();
  F.mes = MESES_D[0] || ''; FC.mes = F.mes; AUD.mes = '';
  F.dia = B.P.length ? B.P[0].dp : hojeBr();
  montarNav();
  ir(EU.p === 'orc' ? 'aud' : 'dia');
}
function telasDoPerfil(){ return EU.p === 'orc' ? T_ORC : T_DIR.concat(T_ORC); }
function montarNav(){
  var h = '';
  function bt(x){ return '<button data-s="' + x[0] + '" onclick="ir(\'' + x[0] + '\')">' + x[1] + '</button>'; }
  if (EU.p !== 'orc') h += '<span class="grp">Diretoria</span>' + T_DIR.map(bt).join('');
  h += '<span class="grp">Orçamento</span>' + T_ORC.map(bt).join('');
  document.getElementById('nav').innerHTML = h;
}
function ir(id){
  var ok = telasDoPerfil().some(function(t){ return t[0] === id; });
  if (!ok) id = telasDoPerfil()[0][0];
  TELA = id;
  [].forEach.call(document.querySelectorAll('#nav button'), function(b){ b.classList.toggle('on', b.getAttribute('data-s') === id); });
  var w = document.getElementById('wrap');
  try {
    w.innerHTML = ({ dia: telaDia, mes: telaMes, cli: telaCli, aud: telaAud, up: telaUp })[id]();
  } catch (e){
    w.innerHTML = '<div class="vazio"><b>Erro ao montar a tela</b><p>' + esc(e.message || e) + '</p></div>';
  }
}
function selMes(atual, fn, comTodos){
  return '<select onchange="' + fn + '(this.value)">' + (comTodos ? '<option value="">Todos os meses</option>' : '') +
    MESES_D.map(function(m){ return '<option value="' + m + '"' + (m === atual ? ' selected' : '') + '>' + mesNome(m) + '</option>'; }).join('') + '</select>';
}
function somar(l){
  var s = { n: l.length, v: 0, v40: 0, comp: 0, tab: 0, it: 0 };
  l.forEach(function(p){ s.v += p.v; s.v40 += p.v40; s.comp += p.comp; s.tab += p.tab; s.it += p.itens.length; });
  s.d = s.comp - s.tab; return s;
}
function kDesvio(s){ return s.tab ? '<b class="' + (s.d > 0.005 ? 'ac' : s.d < -0.005 ? 'ab' : '') + '">' + sn(s.d) + 'R$ ' + rs(s.d) + ' <small>(' + sn(s.d) + pc(Math.abs(s.d / s.tab * 100)) + '%)</small></b>' : '<b>—</b>'; }

/* ============================ cartão ============================ */
function cartao(p, comCk){
  var pz = prazo(p.ent), os = p.os || ('ERP ' + p.erp);
  var itens = p.itens.map(itemLinha).join('');
  var n = p.itens.length;
  return '<div class="pc' + (SEL[p.id] ? ' sel' : '') + '" id="pc_' + esc(p.id) + '">' +
    '<div class="pc-l">' +
    (comCk ? '<input type="checkbox" class="pc-ck" title="Selecionar para imprimir" ' + (SEL[p.id] ? 'checked' : '') + ' onclick="marcar(\'' + esc(p.id) + '\',this.checked)">' : '') +
      '<div class="pc-t">' + marca(p.cd, p.cli) +
        '<div class="pc-os"><span>ORDEM DE SERVIÇO</span><b class="' + (p.os ? '' : 'sm') + '">' + esc(os) + '</b>' +
        '<i class="rev' + (+p.rev > 0 ? ' r1' : '') + '">REV ' + esc(p.rev) + '</i></div></div>' +
      '<div class="pc-c">' + esc(p.cli) + (p.rv ? ' <em>· ' + esc(p.rv) + '</em>' : '') + (p.loc ? ' <em>· ' + esc(p.loc) + '</em>' : '') + '</div>' +
      '<div class="pc-m">ERP ' + esc(p.erp) + ' · ' + n + ' ite' + (n === 1 ? 'm' : 'ns') + '</div>' +
      '<div class="pc-d"><div><span>Data do pedido</span><b>' + esc(p.dp) + '</b><em>' + semana(p.dp) + '</em></div>' +
        '<div><span>Entrega</span><b>' + esc(p.ent) + '</b><em class="' + pz.c + '">' + pz.t + '</em></div></div>' +
      '<div class="pc-v"><div><span>Valor cheio</span><b>R$ ' + rs(p.v) + '</b></div>' +
        '<div class="dy"><span>Valor Dynamics 40%</span><b>R$ ' + rs(p.v40) + '</b></div></div>' +
      '<div class="pc-dv">Contra tabela ' + bdgDesvio(p) + (p.ct && p.ct < n ? '<span>' + p.ct + ' de ' + n + ' com tabela</span>' : '') + '</div>' +
    '</div>' +
    '<button class="pc-tg" onclick="this.parentNode.classList.toggle(\'ab\')">Ver ' + n + ' ite' + (n === 1 ? 'm' : 'ns') + '</button>' +
    '<div class="pc-r"><table class="it"><thead><tr><th>Código</th><th>Descrição</th><th class="r">Qtde × unit.</th><th class="r">Total</th><th>Contra tabela</th><th class="r">Preço tabela</th><th class="r">Diferença</th></tr></thead><tbody>' +
      (itens || '<tr><td colspan="7">Sem itens lidos.</td></tr>') + '</tbody></table></div></div>';
}
function itemLinha(x){
  var c, bd, dfv = 0;
  if (x.tb > 0){
    dfv = x.t - x.tb * x.q; c = clsDif(dfv, 1);
    bd = c === 'eq' ? '<span class="bdg eq">igual</span>' : '<span class="bdg ' + c + '">' + sn(dfv) + pc(Math.abs((x.u - x.tb) / x.tb * 100)) + '%</span>';
  } else { c = 'nd'; bd = '<span class="bdg nd">' + (/DUPLIC/.test(x.st) ? 'duplicado na base' : 'sem tabela') + '</span>'; }
  return '<tr><td class="cd ' + c + '">' + esc(x.c) + '</td><td class="ds">' + esc(x.d) + '</td>' +
    '<td class="r num">' + qt(x.q) + ' ' + esc(x.un) + ' × ' + rs2(x.u) + '</td>' +
    '<td class="r num"><b>' + rs2(x.t) + '</b></td><td>' + bd + '</td>' +
    '<td class="r num">' + (x.tb > 0 ? rs2(x.tb) + '<small>' + (/^\d/.test(x.dt) ? 'rev ' + esc(x.dt) : 'sem data') + '</small>' : '—') + '</td>' +
    '<td class="r num ' + (dfv > 0.005 ? 'tx-ac' : dfv < -0.005 ? 'tx-ab' : '') + '">' + (x.tb > 0 ? sn(dfv) + rs2(dfv) : '—') + '</td></tr>';
}
function marcar(id, v){ if (v) SEL[id] = 1; else delete SEL[id]; var e = document.getElementById('pc_' + id); if (e) e.classList.toggle('sel', !!v); contarSel(); }
function contarSel(){ var e = document.getElementById('nSel'); if (e) e.textContent = Object.keys(SEL).length; }

function blocoData(dp, lista, comCk){
  var s = somar(lista);
  return '<div class="bd"><div class="bd-h"><div class="bd-d"><small>' + semana(dp) + ' · pedidos de venda</small>' + extA(dp) + '</div>' +
    '<div class="bd-k"><div>Pedidos<b>' + s.n + '</b></div><div>Valor cheio<b>R$ ' + rs(s.v) + '</b></div>' +
    '<div>Valor Dynamics<b>R$ ' + rs(s.v40) + '</b></div><div>Contra tabela' + kDesvio(s) + '</div></div></div>' +
    '<div class="bd-b">' + lista.map(function(p){ return cartao(p, comCk); }).join('') + '</div></div>';
}
function emBlocos(lista, comCk){
  var g = {}, ord = [];
  lista.forEach(function(p){ if (!g[p.dp]){ g[p.dp] = []; ord.push(p.dp); } g[p.dp].push(p); });
  ord.sort(function(a, b){ return chave(b) - chave(a); });
  return ord.map(function(d){ return blocoData(d, g[d], comCk); }).join('');
}
function buscar(lista, q){
  q = norm(q).trim(); if (!q) return lista;
  var qd = q.replace(/\D/g, '');
  return lista.filter(function(p){ return p.bus.indexOf(q) >= 0 || (qd.length >= 3 && p.bus.replace(/\D/g, '').indexOf(qd) >= 0 && p.os.replace(/\D/g, '').indexOf(qd) >= 0); });
}

/* ============================ DIA ============================ */
var DIA_HTML = '';
function telaDia(){
  var lista, tit;
  var base = F.mes ? B.P.filter(function(p){ return p.me === F.mes; }) : B.P;
  if (F.q){ lista = buscar(base, F.q); tit = 'Busca “' + esc(F.q) + '” em ' + mesNome(F.mes) + ' · ' + lista.length + ' pedido(s)'; }
  else if (F.todo){ lista = base; tit = 'Todos os dias de ' + mesNome(F.mes); }
  else { lista = B.P.filter(function(p){ return p.dp === F.dia; }); tit = ''; }
  var h = '<div class="fl"><span class="lb">Dia</span><button class="btn sq" onclick="passaDia(-1)" title="Dia anterior">‹</button>' +
    '<input type="date" value="' + isoDe(F.dia) + '" onchange="F.dia=deIso(this.value);F.q=\'\';F.todo=false;F.mes=mesDe(F.dia)||F.mes;ir(\'dia\')">' +
    '<button class="btn sq" onclick="passaDia(1)" title="Próximo dia">›</button>' +
    '<span class="lb">Mês</span>' + selMes(F.mes, 'fMes', true) +
    '<button class="btn' + (F.todo ? ' on' : '') + '" onclick="F.todo=!F.todo;F.q=\'\';ir(\'dia\')">Mês inteiro</button>' +
    '<input type="search" placeholder="Buscar OS ou cliente" value="' + esc(F.q) + '" onkeydown="if(event.key===\'Enter\'){F.q=this.value;ir(\'dia\')}" onsearch="F.q=this.value;ir(\'dia\')">' +
    '<button class="btn red" onclick="imprimirDia()">PDF</button><button class="btn" onclick="excelPedidos(DIA_L,\'pedidos\')">Excel</button></div>';
  window.DIA_L = lista;
  if (tit) h += '<div class="sec">' + tit + '</div>';
  if (!lista.length){
    var viz = vizinhos(F.dia);
    h += '<div class="vazio"><b>' + (F.q ? 'Nada encontrado' : 'Nenhum pedido em ' + extA(F.dia)) + '</b><p>' +
      (F.q ? 'Confira o número da OS ou o nome do cliente. A busca olha o mês escolhido; escolha “Todos os meses” para buscar em tudo.' : 'Escolha outra data no calendário.') + '</p>' +

function divergencias(cod){

    if (p.cd !== cod || p.sv) return;

    p.itens.forEach(function(x){
      var r = { c: x.c, d: x.d, un: x.un, q: x.q, u: x.u, tb: x.tb, os: p.os || 'ERP ' + p.erp, dp: p.dp, dt: x.dt, st: x.st };

function recarregar(){ var t = TELA; srv('carregar', [TK], function(d){ var a = AUD.cod; iniciar(d); AUD.cod = a; ir(t); toast('Atualizado.'); }); }
function excelLog(){

function subir(inp, tipo){
  var fs = [].slice.call(inp.files || []), st = document.getElementById('st_' + tipo);
  if (!fs.length) return;
  var extra = {};
  if (tipo === 'logo'){
    extra.cod = document.getElementById('lgCod').value.trim(); extra.cli = document.getElementById('lgCli').value.trim();
    if (!/^\d{3}$/.test(extra.cod) || !extra.cli){ st.innerHTML = '<div class="fi er">Informe código Dyn (3 dígitos) e nome.</div>'; inp.value = ''; return; }
  }
  st.innerHTML = '';
  (function prox(i){
    if (i >= fs.length){ inp.value = ''; if (tipo === 'logo') recarregar(); return; }
    var f = fs[i], id = 'f' + Date.now() + i;
    st.insertAdjacentHTML('beforeend', '<div class="fi" id="' + id + '">Enviando ' + esc(f.name) + '…</div>');
    var r = new FileReader();
    r.onload = function(){
      srv('enviarArquivo', [TK, tipo, f.name, f.type || 'application/octet-stream', String(r.result).split(',')[1], extra], function(x){
        var e = document.getElementById(id); e.className = 'fi ' + (x.ok ? 'ok' : 'er'); e.textContent = x.msg; prox(i + 1);
      }, function(m){ var e = document.getElementById(id); e.className = 'fi er'; e.textContent = m; prox(i + 1); });
    };
    r.readAsDataURL(f);
  })(0);
}

/* ============================ exportação ============================ */
function csv(nome, L){
  var t = '﻿' + L.map(function(r){ return r.map(function(v){
    if (typeof v === 'number') v = String(Math.round(v * 100) / 100).replace('.', ',');
    v = String(v == null ? '' : v); return /[;"\n]/.test(v) ? '"' + v.replace(/"/g, '""') + '"' : v; }).join(';'); }).join('\r\n');
  var a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([t], { type: 'text/csv;charset=utf-8' }));
  a.download = nome; document.body.appendChild(a); a.click();
  setTimeout(function(){ URL.revokeObjectURL(a.href); a.remove(); }, 800);
}

  l.forEach(function(p){ L.push([p.dp, p.os, p.rev, p.erp, p.cli, p.rv, p.loc, p.ent, p.v, p.v40, p.itens.length, p.ct, p.comp, p.tab, p.comp - p.tab]); });
  csv('Pedidos_' + q + '.csv', L); reg('DOWNLOAD EXCEL PEDIDOS', q + ' · ' + l.length + ' pedidos');
}

function imprimir(titulo, corpo, acao, det){
  var agora = new Date(), dh = agora.toLocaleDateString('pt-BR') + ' ' + agora.toLocaleTimeString('pt-BR').substring(0, 5);
  var st = document.querySelector('style').outerHTML;
  var doc = '<!DOCTYPE html><html><head><meta charset="utf-8"><title>' + esc(titulo) + '</title>' +
    '<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;700;800&family=IBM+Plex+Mono:wght@400;600&family=IBM+Plex+Sans:wght@400;600&display=swap" rel="stylesheet">' +
    st + '<style>' + CSS_PR + '</style></head><body>' +
    '<div class="pr-h"><div><div class="pr-m">DYNAMICS METALÚRGICA</div><b>' + esc(titulo) + '</b></div><span>Emitido por ' + esc(EU.n) + ' em ' + dh + '<br>Fluxo Venda Dynamics</span></div>' +
    corpo + '<div class="pr-f">Documento confidencial de uso interno · Dynamics Metalurgica Ltda · CNPJ 07.243.050/0001-49 · Emissão registrada em nome de ' + esc(EU.u) + ' (LGPD)</div></body></html>';
  var fr = document.getElementById('prFr');
  if (fr) fr.remove();
  fr = document.createElement('iframe'); fr.id = 'prFr';
  fr.style.cssText = 'position:fixed;right:0;bottom:0;width:0;height:0;border:0;visibility:hidden';
  document.body.appendChild(fr);
  var d = fr.contentWindow.document; d.open(); d.write(doc); d.close();
  var feito = false;
  function vai(){ if (feito) return; feito = true; try { fr.contentWindow.focus(); fr.contentWindow.print(); } catch(e){ toast('Não consegui abrir a impressão: ' + e.message); } }
  fr.onload = function(){ setTimeout(vai, 250); };
  setTimeout(vai, 1500);
  reg(acao, det);
  toast('Na janela de impressão, escolha “Salvar como PDF”.');
}
