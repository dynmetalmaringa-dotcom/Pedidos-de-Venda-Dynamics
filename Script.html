<script>
/* =====================================================================
   FLUXO VENDA DYNAMICS · Script V3.8
   ===================================================================== */
var TK = '', EU = null, B = null, TELA = '';
var FV = { mes: '', dia: '', q: '', todo: false, rev: false, fd: 'dp', agr: 'm' }, FR = { mes: '', dia: '', q: '', todo: true, rev: false, fd: 'dp', agr: 'm' };
var FCV = { mes: '', q: '' }, FCR = { mes: '', q: '' };
var F = FV, FC = FCV, MODO = 'v';                          // V3.0 — VENDA (v) ou RETRABALHO (r)
function T(x){ return MODO === 'r' ? 'r' + x : x; }
function PV(){ return MODO === 'r' ? B.PR : B.PVd; }
function nomeModo(){ return MODO === 'r' ? 'retrabalhos' : 'pedidos de venda'; }
var SEL = {};                                              // cartões selecionados
var AUD = { cod: '', mes: '', q: '' };                     // auditoria
var LOGF = 'tudo';
var MESES = ['janeiro','fevereiro','março','abril','maio','junho','julho','agosto','setembro','outubro','novembro','dezembro'];
var SEMANA = ['domingo','segunda-feira','terça-feira','quarta-feira','quinta-feira','sexta-feira','sábado'];
var GRUPOS = [['Venda', [['dia','Dia'],['mes','Mês'],['cli','Clientes']]],
  ['Retrabalho', [['rdia','Dia'],['rmes','Mês'],['rcli','Clientes']]],
  ['Orçamento', [['aud','Auditoria']]],
  ['PCP', [['pcar','Carteira de entrega']]],
  ['Faturamento', [['flan','Lançamento'],['fdash','Dashboard']]],
  ['Arquivos', [['up','Upload'],['reg','Registros']]]];

/* ============================ utilidades ============================ */
function rs(n){ var a = Math.abs(Number(n) || 0); return a > 0 && a < 100 ? a.toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2}) : Math.round(a).toLocaleString('pt-BR'); }
function rs2(n){ return (Math.abs(Number(n) || 0)).toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2}); }
function pc(n){ return (Number(n) || 0).toLocaleString('pt-BR',{minimumFractionDigits:1,maximumFractionDigits:1}); }
function qt(n){ n = Number(n) || 0; return n % 1 ? n.toLocaleString('pt-BR',{maximumFractionDigits:3}) : String(n); }
function esc(s){ return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
function sn(v){ return v > 0.004 ? '+' : v < -0.004 ? '&minus;' : ''; }
function dObj(s){ var m = /^(\d{2})\/(\d{2})\/(\d{2,4})$/.exec(String(s || '').trim()); if (!m) return null; var a = +m[3]; if (a < 100) a += 2000; return new Date(a, +m[2] - 1, +m[1]); }
function chave(s){ var d = dObj(s); return d ? d.getFullYear() * 10000 + (d.getMonth() + 1) * 100 + d.getDate() : 0; }
function mesDe(s){ var d = dObj(s); return d ? d.getFullYear() + '-' + ('0' + (d.getMonth() + 1)).slice(-2) : ''; }
function mesNome(m){ var p = String(m).split('-'); return p.length === 2 ? MESES[+p[1] - 1] + ' ' + p[0] : 'todos os meses'; }
function extA(s){ var d = dObj(s); return d ? d.getDate() + ' de ' + MESES[d.getMonth()] + ' de ' + d.getFullYear() : esc(s); }
function semana(s){ var d = dObj(s); return d ? SEMANA[d.getDay()] : ''; }
function isoDe(s){ var d = dObj(s); return d ? d.getFullYear() + '-' + ('0' + (d.getMonth() + 1)).slice(-2) + '-' + ('0' + d.getDate()).slice(-2) : ''; }
function deIso(v){ var p = String(v).split('-'); return p.length === 3 ? p[2] + '/' + p[1] + '/' + p[0].slice(-2) : ''; }
function hojeBr(){ var h = new Date(); return ('0' + h.getDate()).slice(-2) + '/' + ('0' + (h.getMonth() + 1)).slice(-2) + '/' + String(h.getFullYear()).slice(-2); }
function diasAte(s){ var d = dObj(s); if (!d) return null; var h = new Date(); h.setHours(0,0,0,0); return Math.round((d - h) / 86400000); }
function prazo(s){
  var n = diasAte(s); if (n === null) return { t: '', c: '' };
  if (n === 0) return { t: 'vence hoje', c: 'pr' };
  if (n > 0) return { t: 'em ' + n + ' dia' + (n > 1 ? 's' : ''), c: '' };
  return { t: 'há ' + (-n) + ' dia' + (n < -1 ? 's' : ''), c: 'pr' };
}
function diasRev(s){ var n = diasAte(s); return n === null ? null : Math.max(0, -n); }
function clDias(n){ return n == null ? 'd3' : n > 180 ? 'd3' : n > 90 ? 'd2' : 'd1'; }
function txDias(n){ return n == null ? 'sem data' : n + ' dia' + (n === 1 ? '' : 's'); }
function norm(s){ return String(s || '').toUpperCase().normalize('NFD').replace(/[̀-ͯ]/g, ''); }
function osDe(oc){ return String(oc || '').replace(/-\d{2}$/, ''); }
var CORES = ['#0B63B5','#B0101A','#1C7A48','#A55A1C','#5B45A0','#0F7A8C','#7A1420','#3E4855','#8A6D00','#0B3C7D'];
function corDe(c){ var n = 0, s = String(c || '0'); for (var i = 0; i < s.length; i++) n += s.charCodeAt(i) * (i + 1); return CORES[n % CORES.length]; }
function iniDe(nome){ var p = String(nome || '').trim().split(/[\s._-]+/).filter(String); if (!p.length) return '··'; return p.length === 1 ? p[0].substring(0,2).toUpperCase() : (p[0].charAt(0) + p[1].charAt(0)).toUpperCase(); }
function marca(cd, nome){
  var lg = B && B.logos ? B.logos[cd] : null;
  if (lg) return '<div class="lg"><img src="' + lg + '" alt="' + esc(nome) + '"></div>';
  return '<div class="lg mn" style="background:' + corDe(cd || nome) + '">' + iniDe(nome) + '</div>';
}
function toast(m){ var t = document.getElementById('toast'); t.textContent = m; t.classList.add('on'); clearTimeout(window._tt); window._tt = setTimeout(function(){ t.classList.remove('on'); }, 3600); }
function dif(p){ return p.comp - p.tab; }
function clsDif(v, base){ if (!base) return 'nd'; return v > 0.005 ? 'ac' : v < -0.005 ? 'ab' : 'eq'; }
function bdgDesvio(p){
  if (p.sv) return '<span class="bdg nd">remessa sem valor</span>';
  if (!p.ct) return '<span class="bdg nd">sem tabela</span>';
  var v = dif(p), c = clsDif(v, p.tab);
  if (c === 'eq') return '<span class="bdg eq">igual à tabela</span>';
  return '<span class="bdg ' + c + '">' + sn(v) + 'R$ ' + rs(v) + ' · ' + sn(v) + pc(Math.abs(v / p.tab * 100)) + '%</span>';
}

/* ============================ servidor ============================ */
function srv(fn, args, ok, er){
  var r = google.script.run.withSuccessHandler(ok || function(){}).withFailureHandler(function(e){
    var m = e && e.message ? e.message : String(e);
    if (/SESSAO_EXPIRADA/.test(m)){ toast('Sessão expirada. Entre de novo.'); limparSessao(); mostrarLogin(); return; }
    if (er) er(m); else toast('Erro: ' + m);
  });
  r[fn].apply(r, args || []);
}
function reg(acao, det){ srv('registrar', [TK, acao, det]); }
/* V3.7 — textos gravados sem acento na base aparecem acentuados na tela */
var ACENTOS = [[/\bINCLUIDO/g,'INCLUÍDO'],[/\bEXCLUIDO/g,'EXCLUÍDO'],[/\bREVISAO\b/g,'REVISÃO'],[/\bREVISOES\b/g,'REVISÕES'],[/\bMUDANCA\b/g,'MUDANÇA'],[/\bJA\b/g,'JÁ'],
  [/\bPROGRAMACAO\b/g,'PROGRAMAÇÃO'],[/\bCONDICAO\b/g,'CONDIÇÃO'],[/\bDESCRICAO\b/g,'DESCRIÇÃO'],[/\bPRECO\b/g,'PREÇO'],[/\bOBSERVACAO\b/g,'OBSERVAÇÃO'],
  [/\bNAO\b/g,'NÃO'],[/\bSITUACAO\b/g,'SITUAÇÃO'],[/\bFATURAMENTO LIDO\b/g,'FATURAMENTO LIDO'],[/\bAUTOCORRECAO\b/g,'AUTOCORREÇÃO'],[/\bVIGENCIA\b/g,'VIGÊNCIA'],[/\bDIVERGENCIA/g,'DIVERGÊNCIA'],
  [/\bincluido\b/g,'incluído'],[/\bexcluido\b/g,'excluído'],[/\brevisao\b/g,'revisão'],[/\bmudanca\b/g,'mudança'],[/\bcondicao\b/g,'condição'],[/\bdescricao\b/g,'descrição'],[/\bpreco\b/g,'preço'],[/\bobservacao\b/g,'observação'],[/\bprogramacao\b/g,'programação']];
function acentua(t){ t = String(t == null ? '' : t); ACENTOS.forEach(function(a){ t = t.replace(a[0], a[1]); }); return t; }
function situ(p){ return p.st ? p.st.s : p.fs === 'COMPLETO' ? 'FATURADO' : p.fs === 'PARCIAL' ? 'PARCIAL' : 'LIBERADO'; }
function blocoSt(p){
  var b = '';
  if (p.st) b = '<div class="stb ' + (p.st.s === 'CANCELADO' ? 'ca' : 'pa') + '"><b>' + p.st.s + '</b><span>' + esc(p.st.m) + (p.st.o ? ' · ' + esc(p.st.o) : '') + '</span><em>' + (p.st.sol ? 'solicitado por <b>' + esc(p.st.sol) + '</b> · ' : '') + 'registrado por ' + esc(p.st.u) + ' em ' + esc(p.st.dh) + '</em></div>';
  if (!/^(dia|rdia|pcar)$/.test(TELA) || (EU.t || []).indexOf('dia') < 0 && (EU.t || []).indexOf('rdia') < 0 && (EU.t || []).indexOf('pcar') < 0) return b;
  var id = esc(p.id);
  return b + '<div class="stbt no-pr">' + (p.st ? '<button class="btn sm" onclick="dlgSt(\'' + id + '\',\'LIBERADO\')">Liberar de novo</button>' + (p.st.s === 'PARALISADO' ? '<button class="btn sm" onclick="dlgSt(\'' + id + '\',\'CANCELADO\')">Cancelar</button>' : '')
    : (p.fs === 'COMPLETO' ? '' : '<button class="btn sm" onclick="dlgSt(\'' + id + '\',\'PARALISADO\')">Paralisar</button><button class="btn sm rd" onclick="dlgSt(\'' + id + '\',\'CANCELADO\')">Cancelar pedido</button>')) + '</div>';
}
function dlgSt(id, st){
  var p = B.P.filter(function(x){ return x.id === id; })[0]; if (!p) return;
  var ms = (B.motivos || {})[st] || [];
  var d = document.createElement('div'); d.className = 'dlg'; d.id = 'dlgSt';
  d.innerHTML = '<div class="dlg-c"><h3>' + (st === 'LIBERADO' ? 'Liberar o pedido de novo' : st === 'CANCELADO' ? 'Cancelar pedido' : 'Paralisar pedido') + '</h3>' +
    '<p><b>' + esc(p.os || p.oc) + '</b> · ' + esc(p.cli) + (p.rv ? ' · ' + esc(p.rv) : '') + '</p>' +
    (st === 'LIBERADO' ? '' : '<label>Motivo<select id="dsM"><option value="">— escolha —</option>' + ms.map(function(m){ return '<option>' + esc(m) + '</option>'; }).join('') + '</select></label>') +
    '<label>Solicitado por (obrigatório)<input id="dsS" maxlength="80" list="dsL" placeholder="Nome de quem pediu"></label><datalist id="dsL">' + solicitantes().map(function(n){ return '<option value="' + esc(n) + '">'; }).join('') + '</datalist>' +
    '<label>Observação (opcional)<input id="dsO" maxlength="300" placeholder="Ex.: pedido refeito na OS 139.26.170"></label>' +
    '<div class="dlg-f"><button class="btn" onclick="document.getElementById(\'dlgSt\').remove()">Voltar</button><button class="btn ' + (st === 'CANCELADO' ? 'red' : 'dk') + '" id="dsB" onclick="salvaSt(\'' + esc(id) + '\',\'' + st + '\')">Confirmar</button></div></div>';
  document.body.appendChild(d);
}
function solicitantes(){ var o = {}; B.P.forEach(function(p){ if (p.st && p.st.sol) o[p.st.sol] = 1; }); return Object.keys(o).sort(); }
function salvaSt(id, st){
  var p = B.P.filter(function(x){ return x.id === id; })[0], m = document.getElementById('dsM'), o = document.getElementById('dsO').value.trim();
  var sl = document.getElementById('dsS').value.trim();
  if (m && !m.value){ toast('Escolha o motivo.'); return; }
  if (!sl){ toast('Informe quem solicitou.'); document.getElementById('dsS').focus(); return; }
  var b = document.getElementById('dsB'); b.disabled = true; b.textContent = 'Gravando…';
  srv('mudarStatus', [TK, { oc: p.oc, id: p.id, cli: p.cli, st: st, motivo: m ? m.value : '', obs: o, sol: sl }], function(r){
    toast(r.msg); var d = document.getElementById('dlgSt'); if (d) d.remove();
    if (r.ok){ var os = String(p.oc).replace(/-\d{1,2}$/, ''); B.P.forEach(function(x){ if (String(x.oc).replace(/-\d{1,2}$/, '') === os){ if (r.st) x.st = r.st; else delete x.st; } }); ir(TELA); }
  }, function(e){ b.disabled = false; b.textContent = 'Confirmar'; toast('Falha: ' + e); });
}
function guardar(k, v){ try { if (v) sessionStorage.setItem(k, v); else sessionStorage.removeItem(k); } catch(e){} }
function lerG(k){ try { return sessionStorage.getItem(k) || ''; } catch(e){ return ''; } }
function limparSessao(){ TK = ''; guardar('fvd_tk', ''); guardar('fvd_eu', ''); }

/* ============================ login e termo ============================ */
var TERMO = '<p>Este termo regula o acesso ao aplicativo <b>Fluxo Venda Dynamics</b>, de propriedade da <b>Dynamics Metalurgica Ltda</b>, CNPJ 07.243.050/0001-49, com sede na Avenida Pioneiro Antonio Ruiz Saldanha, 2358, Jardim Industrial, Maringá-PR, CEP 87.065-290 (“Empresa”), controladora dos dados aqui tratados. Responsável: <b>Michele Puma</b>.</p>' +
  '<h4>1. Objeto</h4><p>O aplicativo reúne pedidos de venda, ordens de serviço, valores, tabelas de preço e informações comerciais de clientes da Empresa e do Grupo Pailon. Todo o conteúdo é <b>informação confidencial</b> e de uso exclusivamente interno.</p>' +
  '<h4>2. Compromisso de confidencialidade</h4><p>O usuário se compromete a: (a) usar as informações somente para as atividades da sua função; (b) não copiar, fotografar, imprimir, exportar ou repassar dados a terceiros, concorrentes, clientes ou fornecedores sem autorização da Diretoria; (c) não compartilhar usuário e senha, que são pessoais e intransferíveis; (d) encerrar a sessão ao deixar o equipamento; (e) comunicar imediatamente à Diretoria qualquer acesso indevido, perda ou vazamento.</p>' +
  '<h4>3. Proteção de dados pessoais (LGPD)</h4><p>O tratamento observa a Lei nº 13.709/2018. Os dados de clientes, revendas e contatos são tratados para execução de contratos e procedimentos comerciais (art. 7º, V) e legítimo interesse da Empresa na gestão de vendas e preços (art. 7º, IX), limitados ao mínimo necessário (art. 6º, III). Os dados do próprio usuário (nome, usuário, data e hora de acesso, ações realizadas) são tratados para segurança da informação e controle de acesso.</p>' +
  '<h4>4. Registro de atividades</h4><p>O usuário declara ciência de que <b>todos os acessos, consultas, impressões, downloads e envios de arquivos são registrados</b> com identificação, data e hora, e podem ser auditados pela Empresa.</p>' +
  '<h4>5. Direitos do titular</h4><p>Os titulares podem exercer os direitos do art. 18 da LGPD (confirmação, acesso, correção, anonimização, eliminação e informação sobre compartilhamento) pelo contato com a responsável indicada acima.</p>' +
  '<h4>6. Vigência e penalidades</h4><p>As obrigações de sigilo valem durante o vínculo com a Empresa e por 5 (cinco) anos após o seu término. O descumprimento sujeita o usuário às medidas disciplinares cabíveis, à responsabilização civil por perdas e danos e às sanções legais aplicáveis, inclusive às previstas na LGPD e no art. 195 da Lei nº 9.279/1996.</p>' +
  '<h4>7. Aceite e assinatura eletrônica</h4><p>Ao informar nome completo e CPF e clicar em “Assinar e entrar”, o usuário declara ter lido integralmente e concordado com este termo, valendo como assinatura eletrônica (Lei nº 14.063/2020, art. 4º, I). O aceite é registrado com nome, CPF, usuário, data e hora.</p>' +
  '<p style="margin-top:12px;color:#8C96A4">Maringá-PR · Dynamics Metalurgica Ltda · Termo versão 1.1</p>';
document.getElementById('termoTxt').innerHTML = TERMO;
var PEND = null;   // usuário e senha aguardando a assinatura do termo
function verTermo(){
  var t = document.getElementById('termoTxt'); t.scrollTop = 0;
  ['tNome','tCpf','tOk','tBt'].forEach(function(i){ document.getElementById(i).disabled = true; });
  document.getElementById('tOk').checked = false; document.getElementById('tErr').textContent = '';
  var av = document.getElementById('mdlAv'); av.className = 'mdl-av'; av.textContent = 'Role o termo até o fim para liberar a assinatura.';
  document.getElementById('mdl').classList.add('on');
  setTimeout(function(){ rolouTermo(t); }, 50);
}
function fecharTermo(){ document.getElementById('mdl').classList.remove('on'); PEND = null; }
function rolouTermo(t){
  if (t.scrollTop + t.clientHeight < t.scrollHeight - 8) return;
  if (!document.getElementById('tNome').disabled) return;
  ['tNome','tCpf','tOk'].forEach(function(i){ document.getElementById(i).disabled = false; });
  var av = document.getElementById('mdlAv'); av.className = 'mdl-av ok'; av.textContent = 'Termo lido. Preencha nome completo e CPF para assinar.';
  document.getElementById('tBt').disabled = false;
}
function mascCpf(i){
  var d = i.value.replace(/\D/g, '').substring(0, 11), o = d;
  if (d.length > 9) o = d.substring(0,3) + '.' + d.substring(3,6) + '.' + d.substring(6,9) + '-' + d.substring(9);
  else if (d.length > 6) o = d.substring(0,3) + '.' + d.substring(3,6) + '.' + d.substring(6);
  else if (d.length > 3) o = d.substring(0,3) + '.' + d.substring(3);
  i.value = o;
}
function cpfOk(c){
  c = String(c).replace(/\D/g, '');
  if (c.length !== 11 || /^(\d)\1{10}$/.test(c)) return false;
  for (var t = 9; t < 11; t++){ var s = 0; for (var i = 0; i < t; i++) s += +c[i] * (t + 1 - i); if (((s * 10) % 11) % 10 !== +c[t]) return false; }
  return true;
}
function assinarTermo(){
  var n = document.getElementById('tNome').value.trim().toUpperCase().replace(/\s+/g, ' '), c = document.getElementById('tCpf').value, er = document.getElementById('tErr');
  if (n.split(' ').length < 2 || n.length < 6){ er.textContent = 'Informe o nome completo.'; return; }
  if (!cpfOk(c)){ er.textContent = 'CPF inválido.'; return; }
  if (!document.getElementById('tOk').checked){ er.textContent = 'Marque a confirmação de leitura.'; return; }
  if (!PEND){ fecharTermo(); return; }
  var bt = document.getElementById('tBt'); bt.disabled = true; bt.textContent = 'Assinando…';
  var p = PEND;
  fazerLogin(p.u, p.s, { nome: n, cpf: c }, function(){ bt.textContent = 'Assinar e entrar'; bt.disabled = false; });
}

function mostrarLogin(){
  document.getElementById('app').style.display = 'none';
  document.getElementById('lgn').style.display = '';
  document.getElementById('lgB').disabled = false;
}
function entrar(e){
  e.preventDefault();
  var u = document.getElementById('lgU').value.trim().toUpperCase(), s = document.getElementById('lgS').value;
  var er = document.getElementById('lgE');
  if (!u || !s){ er.textContent = 'Informe usuário e senha.'; return; }
  fazerLogin(u, s, null);
}
function fazerLogin(u, s, aceite, depois){
  var er = document.getElementById('lgE'), bt = document.getElementById('lgB');
  bt.disabled = true; bt.textContent = 'Entrando…'; er.textContent = '';
  srv('login', [u, s, aceite], function(r){
    bt.disabled = false; bt.textContent = 'Entrar'; if (depois) depois();
    if (!r.ok){
      if (r.termo){ PEND = { u: u, s: s }; verTermo(); return; }
      if (aceite){ document.getElementById('tErr').textContent = r.msg; return; }
      er.textContent = r.msg; return;
    }
    document.getElementById('mdl').classList.remove('on'); PEND = null;
    TK = r.token; EU = { u: r.usuario, n: r.nome, t: r.telas };
    guardar('fvd_tk', TK); guardar('fvd_eu', JSON.stringify(EU));
    document.getElementById('lgS').value = '';
    abrirApp();
  }, function(m){ bt.disabled = false; bt.textContent = 'Entrar'; if (depois) depois(); er.textContent = 'Falha: ' + m; });
}
function sairApp(){ clearInterval(AUTO_T); AUTO_T = null; srv('sair', [TK]); limparSessao(); B = null; mostrarLogin(); }

function abrirApp(){
  document.getElementById('lgn').style.display = 'none';
  document.getElementById('app').style.display = '';
  document.getElementById('euNome').innerHTML = '<b>' + esc(EU.n) + '</b>';
  document.getElementById('euIni').textContent = iniDe(EU.n);
  document.getElementById('wrap').innerHTML = '<div class="carregando"><div class="sp1"></div>Carregando a base…</div>';
  srv('carregar', [TK], iniciar, function(m){
    document.getElementById('wrap').innerHTML = '<div class="vazio"><b>Não consegui carregar a base</b><p>' + esc(m) + '</p></div>';
  });
}

(function(){
  var tk = lerG('fvd_tk'), eu = lerG('fvd_eu');
  if (tk && eu){ try { TK = tk; EU = JSON.parse(eu); abrirApp(); return; } catch(e){} }
  mostrarLogin();
})();

/* ============================ arranque ============================ */
var MESES_D = [];
function preparar(d){
  B = d; EU = d.eu;
  B.P.forEach(function(p){
    p.me = mesDe(p.dp); p.k = chave(p.dp); p.os = p.rt ? '' : osDe(p.oc);
    var c = String(p.dc || ''); p.dcd = /^\d{2}\/\d{2}\/\d{4}/.test(c) ? c.substr(0, 6) + c.substr(8, 2) : '';
    p.mc = mesDe(p.dcd); p.kc = chave(p.dcd);
    p.fx = p.fx || 2.5; p.sal = Math.max(0, p.v - (p.fv40 || 0) * p.fx);
    p.bus = norm([p.oc, p.os.replace(/\D/g, ''), p.erp, p.cli, p.rv, p.loc, p.org || ''].join(' '));
  });
  B.P.sort(function(a, b){ return b.k - a.k || b.v - a.v; });
  B.PVd = B.P.filter(function(p){ return !p.rt; }); B.PR = B.P.filter(function(p){ return p.rt; });
  var m = {}; B.P.forEach(function(p){ if (p.me) m[p.me] = 1; });
  MESES_D = Object.keys(m).sort().reverse();
  marcaHora();
}
function iniciar(d){

function montaImp(x, nome){
  var porErp = {}; B.P.forEach(function(p){ if (p.erp) porErp[p.erp] = p; });
  var G = {}, ord = [];
  x.linhas.forEach(function(l, i){
    var p = porErp[l.erp], it = p ? p.itens.filter(function(y){ return y.c === l.c; })[0] : null;
    var st, pend = it ? Math.max(0, it.q - (it.fq || 0)) : 0, up = it ? Math.round(it.u / (p.fx || 2.5) * 100) / 100 : 0;
    if (!p) st = ['sem', 'pedido ERP ' + l.erp + ' não está no app'];
    else if (!it) st = ['sem', 'item não existe no pedido'];
    else if (pend <= 0.0001) st = ['fat', 'já faturado no app'];
    else if (l.q > pend + 0.0001) st = ['dif', 'quantidade maior que o saldo (' + qt(pend) + ')'];
    else if (Math.abs(l.u - up) > 0.011) st = ['dif', 'valor diferente do pedido (' + rs2(up) + ')'];
    else st = ['ok', l.q < pend - 0.0001 ? 'parcial · saldo ' + qt(pend) : 'confere'];
    var k = l.erp; if (!G[k]){ G[k] = { erp: l.erp, p: p, obs: l.obs, dat: l.dat, nf: l.nf, l: [] }; ord.push(k); }
    G[k].l.push({ i: i, x: l, it: it, up: up, pend: pend, st: st, ck: st[0] === 'ok' || st[0] === 'dif' });
  });
  FIMP = { nome: nome, temNf: x.temNf, G: G, ord: ord };
}

  var ck = Object.keys(cli).sort(function(a, b){ return cli[b] - cli[a]; }), cmx = ck.length ? cli[ck[0]] : 1;

var T0 = 0, AUTO_T = null, OCUPADO = false;

function atualizar(auto){
  if (OCUPADO || !TK) return;
  if (auto && (document.hidden || TELA === 'up' && document.querySelector('.fi:not(.ok):not(.er)'))) return;
  OCUPADO = true; T0 = Date.now();
  var rf = document.getElementById('rf'); rf.classList.add('gi');
  var antes = {}; (B && B.P || []).forEach(function(p){ antes[p.id + '|' + p.rev] = 1; });
  var y = window.scrollY;
  srv('carregar', [TK], function(d){
    OCUPADO = false; rf.classList.remove('gi');
    preparar(d); T0 = 0;
    var novos = B.P.filter(function(p){ return !antes[p.id + '|' + p.rev]; });
    if (F.mes && MESES_D.indexOf(F.mes) < 0) F.mes = MESES_D[0] || '';
    ir(TELA); window.scrollTo(0, y);
    if (novos.length && Object.keys(antes).length) {
      toast(novos.length + ' novo(s) pedido(s) de venda: ' + novos.slice(0, 3).map(function(p){ return (p.os || 'ERP ' + p.erp) + ' ' + p.cli; }).join(' · '));
      document.title = '(' + novos.length + ') Pedidos de Venda';
      setTimeout(function(){ document.title = 'Fluxo Venda Dynamics'; }, 60000);
    } else if (!auto) toast('Atualizado.');
  }, function(m){ OCUPADO = false; rf.classList.remove('gi'); if (!auto) toast('Falha ao atualizar: ' + m); });
}
function autoTroca(v, silencioso){
  try { localStorage.setItem('fvd_auto', v ? '1' : '0'); } catch(e){}
  clearInterval(AUTO_T); AUTO_T = null;
  if (v) AUTO_T = setInterval(function(){ atualizar(true); }, 120000);

function subir(inp, tipo){
  var fs = [].slice.call(inp.files || []), st = document.getElementById('st_' + tipo);
  if (!fs.length) return;
  var extra = {};
  if (tipo === 'logo'){
    extra.cod = document.getElementById('lgCod').value.trim(); extra.cli = document.getElementById('lgCli').value.trim();
    if (!/^\d{3}$/.test(extra.cod) || !extra.cli){ st.innerHTML = '<div class="fi er">Informe código Dyn (3 dígitos) e nome.</div>'; inp.value = ''; return; }
  }
  st.innerHTML = '';
  (function prox(i){
    if (i >= fs.length){ inp.value = ''; if (tipo === 'logo') recarregar(); return; }
    var f = fs[i], id = 'f' + Date.now() + i;
    st.insertAdjacentHTML('beforeend', '<div class="fi" id="' + id + '">Enviando ' + esc(f.name) + '…</div>');
    var r = new FileReader();
    r.onload = function(){
      srv('enviarArquivo', [TK, tipo, f.name, f.type || 'application/octet-stream', String(r.result).split(',')[1], extra], function(x){
        var e = document.getElementById(id); e.className = 'fi ' + (x.ok ? 'ok' : 'er'); e.textContent = x.msg; prox(i + 1);
      }, function(m){ var e = document.getElementById(id); e.className = 'fi er'; e.textContent = m; prox(i + 1); });
    };
    r.readAsDataURL(f);
  })(0);
}

function csv(nome, L){
  var t = '﻿' + L.map(function(r){ return r.map(function(v){

  var a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([t], { type: 'text/csv;charset=utf-8' }));
  a.download = nome; document.body.appendChild(a); a.click();
  setTimeout(function(){ URL.revokeObjectURL(a.href); a.remove(); }, 800);
