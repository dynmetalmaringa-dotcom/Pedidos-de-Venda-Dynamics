<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pedidos de Venda Dynamics</title>
<meta name="theme-color" content="#15181D">
<meta name="robots" content="noindex, nofollow">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icone192.png">
<link rel="apple-touch-icon" href="icone.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Vendas Dynamics">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<style>
  html,body{margin:0;height:100%;background:#15181D;font-family:system-ui,-apple-system,sans-serif}
  iframe{position:fixed;inset:0;width:100%;height:100%;border:0;background:#F2F4F6}
  .ld{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;color:#9AA4B2;font-size:14px}
  .ld b{font-size:26px;letter-spacing:.08em;color:#D0121C}
  .sp{width:22px;height:22px;border:3px solid #3A424E;border-top-color:#D0121C;border-radius:50%;animation:g .8s linear infinite}
  @keyframes g{to{transform:rotate(360deg)}}
  #inst{position:fixed;right:14px;bottom:14px;z-index:9;display:none;background:#D0121C;color:#fff;border:0;border-radius:24px;padding:12px 18px;font-weight:700;font-size:14px;box-shadow:0 4px 14px rgba(0,0,0,.35);cursor:pointer}
</style>
</head>
<body>
<div class="ld" id="ld"><b>DYNAMICS</b><div class="sp"></div>Abrindo Pedidos de Venda…</div>

<iframe id="app" title="Pedidos de Venda Dynamics"
  allow="clipboard-write; fullscreen"
  referrerpolicy="no-referrer"></iframe>

<button id="inst">Instalar app</button>

<script>
/* ================================================================
   ÚNICO AJUSTE: link /exec do Apps Script
   (Apps Script > Implantar > Gerenciar implantações > App da Web)
   ================================================================ */
var APP_URL = 'https://script.google.com/macros/s/AKfycbzONq_lPunaJ-wqZT-BZwUgKrZSano8R9qw_N9MkJ73Q9J7Y3oRZyKcdFkTkvfVCyw2/exec';

var fr = document.getElementById('app'), ld = document.getElementById('ld');
if (!/^https:\/\/script\.google\.com\/.+\/exec/.test(APP_URL)) {
  ld.innerHTML = '<b>DYNAMICS</b>Link do app ainda não configurado no index.html.';
} else {
  fr.src = APP_URL;
  fr.onload = function () { ld.style.display = 'none'; };
  setTimeout(function () { ld.style.display = 'none'; }, 8000);
}

/* instalação (Android / computador) */
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(function () {});
var pedido = null, bt = document.getElementById('inst');
window.addEventListener('beforeinstallprompt', function (e) {
  e.preventDefault(); pedido = e; bt.style.display = 'block';
});
bt.onclick = function () {
  if (!pedido) return;
  pedido.prompt();
  pedido.userChoice.finally(function () { pedido = null; bt.style.display = 'none'; });
};
window.addEventListener('appinstalled', function () { bt.style.display = 'none'; });
</script>
</body>
</html>
